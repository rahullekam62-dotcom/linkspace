<!DOCTYPE html>
<html>
<head>
  <title>LinkSpace Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{margin:0; padding:0; box-sizing:border-box;}
    body{ font-family: Arial; color:rgb(243, 245, 243); min-height:100vh; }
    .bg-video{ position: fixed; top:0; left:0; width:100%; height:100%; z-index:-2; object-fit:cover; filter: brightness(0.5); }
    .bg-overlay{ position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background: radial-gradient(circle at 50% 0%, #4955f8 0%, #7676f4 50%, #733fed 100%); opacity: 0.85; }
    #stars{ position:fixed; top:0; left:0; z-index:-1; }
    .card{ width: 350px; margin: 20px auto; padding: 25px 18px; text-align:center; background: rgba(43, 208, 90, 0.1); border: 1px solid rgba(255,255,255,0.20); backdrop-filter: blur(18px); border-radius: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    img.profile{ width:120px; height:120px; border-radius:50%; border:3px solid #a855f7; object-fit:cover; }
    .online{ display:inline-block; background:rgba(26, 25, 25, 0.35); padding:6px 14px; border-radius:20px; font-size:12px; margin:12px 0; border:1px solid rgba(51, 252, 37, 0.15); }
    .dot{ color:#22c55e; }
    h1{ font-size:32px; background: linear-gradient(90deg, #fff, #f4f3f5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    p{ color:#f2faf3; margin:8px 0 15px; min-height:20px; }
    .cursor{ color:white; animation: blink 0.7s infinite; }
    @keyframes blink{ 50%{opacity:0;} }
    .icons{ display:flex; justify-content:center; gap:12px; margin:15px 0 20px 0; }
    .icons a{ width:45px; height:45px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.20); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; text-decoration:none; }
    .btn{ display:flex; align-items:center; gap:12px; color:white; padding:12px; margin:12px 0; border-radius:16px; text-decoration:none; font-weight:bold; text-align:left; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); }
    .icon-box{ width:48px; height:48px; min-width:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; }
    .insta-bg{ background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
    .yt-bg{ background:#FF0000; }
    .wa-bg{ background:#25D366; }
    .prod-bg{ background:#111; border:1px solid #333; }
    .btn small{ display:block; font-weight:normal; color:#cbd5e1; font-size:12px; margin-top:3px; }
    .arrow{ margin-left:auto; }
  </style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="https://cdn.coverr.co/videos/coverr-purple-nebula-abstract-.../mp4" type="video/mp4"></video>
<div class="bg-overlay"></div>
<canvas id="stars"></canvas>
<div class="card">
  <img id="photo" class="profile" src="photo.png">
  <br>
  <span class="online"><span class="dot">●</span> currently building • online</span>
  <h1 id="fullName">Loading...</h1>
  <div id="usernameDisplay" style="display:none"></div>
  <p><span id="typing"></span><span class="cursor">|</span></p>
  <div id="bio" style="display:none"></div>

  <!-- ✅ TOP ICONS - Screenshot jaisa: YouTube, Instagram, TikTok, Mail -->
  <div class="icons">
    <a id="topYt" href="#" target="_blank"><i class="fa-brands fa-youtube"></i></a>
    <a id="topInsta" href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    <a id="topTikTok" href="#" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
    <a id="topMail" href="#" target="_blank"><i class="fa-solid fa-envelope"></i></a>
  </div>

  <!-- ✅ FIX: Ye 3 button ab hamesha dikhenge, Screenshot jaisa -->
  <!-- Agar Dashboard se link aayega to uska URL inhi me lag jayega -->
  <div id="linksList">
    <a id="btnInsta" class="btn" href="#" target="_blank">
      <span class="icon-box insta-bg"><i class="fa-brands fa-instagram"></i></span><div>Instagram <small>Follow karo</small></div><span class="arrow">↗</span>
    </a>
    <a id="btnYt" class="btn" href="#" target="_blank">
      <span class="icon-box yt-bg"><i class="fa-brands fa-youtube"></i></span><div>YouTube <small>Subscribe karo</small></div><span class="arrow">↗</span>
    </a>
    <a id="btnWa" class="btn" href="https://wa.me/919343262030" target="_blank">
      <span class="icon-box wa-bg"><i class="fa-brands fa-whatsapp"></i></span><div>WhatsApp <small>Chat karo</small></div><span class="arrow">↗</span>
    </a>
  </div>

  <h3 style="margin:25px 0 10px;">My Products 🛍️</h3>
  <!-- ✅ FIX: Products bhi ab Screenshot jaisa hamesha dikhenge -->
  <div id="productsList">
    <a id="prod1" class="btn" href="#" target="_blank"><span class="icon-box prod-bg"><i class="fa-solid fa-bag-shopping"></i></span><div>Product 1 <small>Buy Now</small></div><span class="arrow">↗</span></a>
    <a id="prod2" class="btn" href="#" target="_blank"><span class="icon-box prod-bg"><i class="fa-solid fa-bag-shopping"></i></span><div>Product 2 <small>Buy Now</small></div><span class="arrow">↗</span></a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD3hKXZ87S5SgSfFqUNG7uKChuX-iVSwSo",
    authDomain: "linkspace-e77d2.firebaseapp.com",
    databaseURL: "https://linkspace-e77d2-default-rtdb.firebaseio.com",
    projectId: "linkspace-e77d2",
    storageBucket: "linkspace-e77d2.firebasestorage.app",
    messagingSenderId: "787498317437",
    appId: "1:787498317437:web:6b01e5c38738dc4a282314",
    measurementId: "G-JQWGWZQQMQ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const rtdb = firebase.database();

  let username = "";
  const params = new URLSearchParams(window.location.search);
  username = params.get("u") || params.get("username") || "";
  if (!username) {
    const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
    const parts = path.split("/").filter(Boolean);
    if (parts.length > 0 && parts[0] !== "index.html" && !parts[0].includes(".html")) username = parts[0];
  }
  if (!username) username = "rr44";
  username = username.trim().toLowerCase();

  let words = ["Surajpur | Creator", "YouTuber", "Instagram Star"];
  let wi = 0, li = 0;
  let el = document.getElementById("typing");
  function type2(){
    if(li <= words[wi].length){ el.innerHTML = words[wi].substring(0, li); li++; setTimeout(type2, 100); }
    else { setTimeout(()=>{ li=0; wi=(wi+1)%words.length; type2(); }, 1500); }
  }
  type2();

  // ✅ PROFILE - Firestore se
  db.collection("users").doc(username).get().then(doc => {
    if (!doc.exists) { document.getElementById("fullName").innerText = "User Not Found"; return; }
    const data = doc.data();
    if (data.name) document.getElementById("fullName").innerText = data.name;
    if (data.bio) { document.getElementById("bio").innerText = data.bio; words = [data.bio, "Surajpur | Creator", "YouTuber"]; }
    if (data.photoUrl) document.getElementById("photo").src = data.photoUrl;
    document.title = (data.name || username) + " | LinkSpace";
    if (data.instagram) { document.getElementById("topInsta").href = data.instagram; document.getElementById("btnInsta").href = data.instagram; }
    if (data.youtube) { document.getElementById("topYt").href = data.youtube; document.getElementById("btnYt").href = data.youtube; }
    if (data.whatsapp) { document.getElementById("btnWa").href = data.whatsapp; }
    if (data.email) document.getElementById("topMail").href = "mailto:" + data.email;
    if (data.tiktok) document.getElementById("topTikTok").href = data.tiktok;
  });

  // ✅ LINKS FIX: Ab Dashboard ka link aayega to Screenshot wale button ka URL badal dega
  // Nahi aayega to bhi button gayab nahi hoga, wahi dikhega
  function handleLink(l){
    if (l.isActive === false) return;
    const url = l.url || l.link || l.href || l.value || "#";
    const title = (l.title || l.name || "").toLowerCase();
    // ✅ Instagram wala link aaya to Instagram button + top icon dono me lagao
    if (title.includes("insta")) { document.getElementById("btnInsta").href = url; document.getElementById("topInsta").href = url; }
    // ✅ YouTube wala link aaya to YouTube button + top icon dono me lagao
    else if (title.includes("youtube") || title.includes("yt") || title.includes("you")) { document.getElementById("btnYt").href = url; document.getElementById("topYt").href = url; }
    // ✅ WhatsApp wala link aaya to WhatsApp button me lagao
    else if (title.includes("whats") || title.includes("whatsapp")) { document.getElementById("btnWa").href = url; }
    // ✅ TikTok wala link aaya to top TikTok icon me lagao
    else if (title.includes("tiktok") || title.includes("tik")) { document.getElementById("topTikTok").href = url; }
    // ✅ Mail wala link aaya to top Mail icon me lagao
    else if (title.includes("mail") || title.includes("email")) { document.getElementById("topMail").href = url; }
    // ✅ Agar koi naya link hai jaise Telegram, to uska alag button bana do
    else {
      const box = document.getElementById("linksList");
      // Duplicate na bane isliye check karo
      if (box.innerHTML.includes(url)) return;
      box.innerHTML += `<a class="btn" href="${url}" target="_blank"><span class="icon-box prod-bg"><i class="fa-solid fa-link"></i></span><div>${l.title || "Link"} <small>Open karo</small></div><span class="arrow">↗</span></a>`;
    }
  }

  // ✅ Firestore + RTDB dono se Links lo
  db.collection("users").doc(username).collection("links").get().then(snap => {
    snap.forEach(d => handleLink(d.data()));
    rtdb.ref("users/" + username + "/links").once("value").then(s => { const v = s.val(); if(v) Object.values(v).forEach(handleLink); });
  }).catch(() => {
    rtdb.ref("users/" + username + "/links").once("value").then(s => { const v = s.val(); if(v) Object.values(v).forEach(handleLink); });
  });

  // ✅ PRODUCTS FIX: Dashboard se product aayega to Product 1 / Product 2 ki jagah lega
  // Nahi aayega to bhi Screenshot jaisa Product 1 / Product 2 dikhega
  function handleProduct(p, index){
    if (p.isActive === false) return;
    const title = p.title || p.name || p.productName || ("Product " + (index+1));
    const desc = p.desc || p.description || p.bio || "Buy Now";
    const price = p.price || p.amount || "";
    const url = p.url || p.link || p.href || p.buyLink || "#";
    // Pehle 2 products ko replace karo, 3rd se naya button banao
    if (index === 0) {
      document.getElementById("prod1").href = url;
      document.getElementById("prod1").querySelector("div").innerHTML = `${title} <small>${desc} ${price ? ' - ₹'+price : ''}</small>`;
    } else if (index === 1) {
      document.getElementById("prod2").href = url;
      document.getElementById("prod2").querySelector("div").innerHTML = `${title} <small>${desc} ${price ? ' - ₹'+price : ''}</small>`;
    } else {
      document.getElementById("productsList").innerHTML += `<a class="btn" href="${url}" target="_blank"><span class="icon-box prod-bg"><i class="fa-solid fa-bag-shopping"></i></span><div>${title} <small>${desc} ${price ? ' - ₹'+price : ''}</small></div><span class="arrow">↗</span></a>`;
    }
  }

  let prodIndex = 0;
  db.collection("users").doc(username).collection("products").get().then(snap => {
    snap.forEach(d => { handleProduct(d.data(), prodIndex); prodIndex++; });
    rtdb.ref("users/" + username + "/products").once("value").then(s => { const v = s.val(); if(v) Object.values(v).forEach(p => { handleProduct(p, prodIndex); prodIndex++; }); });
  }).catch(() => {
    rtdb.ref("users/" + username + "/products").once("value").then(s => { const v = s.val(); if(v) Object.values(v).forEach(p => { handleProduct(p, prodIndex); prodIndex++; }); });
  });

  let canvas = document.getElementById("stars");
  let ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let stars = [];
  for(let i=0;i<80;i++){ stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.5, s:Math.random()*0.5+0.2}); }
  function drawStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    stars.forEach(st=>{ ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill(); st.y -= st.s; if(st.y<0) st.y=canvas.height; });
    requestAnimationFrame(drawStars);
  }
  drawStars();
</script>
</body>
</html>
