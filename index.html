<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    body{font-family:sans-serif;background:#f5f5f5;text-align:center;padding:20px}
    .card{background:#fff;padding:24px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}
    #photo{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#ddd}
    #fullName{font-size:24px;font-weight:700;margin:12px 0 4px}
    #bio{color:#666;font-size:15px}
  </style>
</head>
<body>
<div class="card">
  <img id="photo" src="https://via.placeholder.com/120">
  <div id="fullName">Loading...</div>
  <div id="bio"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  // Yahan apna Firebase Config daal de
  const firebaseConfig = {
    apiKey: "TERI_API_KEY",
    authDomain: "TERA_PROJECT.firebaseapp.com",
    projectId: "TERA_PROJECT_ID",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // URL se username lega, page pe kabhi dikhayega nahi
  const username = window.location.pathname.split("/").pop();

  db.collection("users").doc(username).get().then(doc => {
    if(doc.exists){
      const d = doc.data();
      document.getElementById('fullName').innerText = d.name || "";
      document.getElementById('bio').innerText = d.bio || "";
      if(d.photoUrl) document.getElementById('photo').src = d.photoUrl;
    } else {
      document.getElementById('fullName').innerText = "User not found";
    }
  });
</script>
</body>
</html>
