<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkSpace Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{margin:0; padding:0; box-sizing:border-box;}

    body{ font-family: Arial; color:rgb(243, 245, 243); min-height:100vh; padding: 15px;}
    .bg-video{ position: fixed; top:0; left:0; width:100%; height:100%; z-index:-2; object-fit:cover; filter: brightness(0.5); }
    .bg-overlay{ position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background: radial-gradient(circle at 50% 0%, #4955f8 0%, #7676f4 50%, #733fed 100%); opacity: 0.85; }
    #stars{ position:fixed; top:0; left:0; z-index:-1; }

    /* ✅ FIX: Phone me pura cover karega + 15px padding ke saath */
    .card{ width: 100%; max-width: 420px; margin: 0 auto; min-height: calc(100vh - 30px); padding: 25px 18px; text-align:center; background: rgba(43, 208, 90, 0.1); border: 1px solid rgba(255,255,255,0.20); backdrop-filter: blur(18px); border-radius: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    img.profile{ width:120px; height:120px; border-radius:50%; border:3px solid #a855f7; object-fit:cover; }
    .online{ display:inline-block; background:rgba(26, 25, 25, 0.35); padding:6px 14px; border-radius:20px; font-size:12px; margin:12px 0; border:1px solid rgba(51, 252, 37, 0.15); }
    .dot{ color:#22c55e; }
    h1{ font-size:32px; background: linear-gradient(90deg, #fff, #f4f3f5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    p{ color:#f2faf3; margin:8px 0 15px; min-height:20px; }
    .cursor{ color:white; animation: blink 0.7s infinite; }
    @keyframes blink{ 50%{opacity:0;} }
    .icons{ display:flex; justify-content:center; gap:12px; margin:15px 0 20px 0; }
    .icons a{ width:45px; height:45px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.20); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; text-decoration:none; }
    .btn{ display:flex; align-items:center; gap:12px; color:white; padding:12px; margin:12px 0; border-radius:16px; text-decoration:none; font-weight:bold; text-align:left; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); }
    .icon-box{ width:48px; height:48px; min-width:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; overflow:hidden; }
    .icon-box img{ width:100%; height:100%; object-fit:cover; border-radius:12px; }
    .insta-bg{ background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
    .yt-bg{ background:#FF0000; }
    .wa-bg{ background:#25D366; }
    .prod-bg{ background:#111; border:1px solid #333; }
    .btn small{ display:block; font-weight:normal; color:#cbd5e1; font-size:12px; margin-top:3px; }
    .arrow{ margin-left:auto; }
  </style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="https://cdn.coverr.co/videos/coverr-purple-nebula-abstract-.../mp4" type="video/mp4"></video>
<div class="bg-overlay"></div>
<canvas id="stars"></canvas>
<div class="card">
  <img id="photo" class="profile" src="photo.png">
  <br>
  <span class="online"><span class="dot">●</span> currently building • online</span>
  <h1 id="fullName">Loading...</h1>
  <div id="usernameDisplay" style="display:none"></div>
  <p><span id="typing"></span><span class="cursor">|</span></p>
  <div id="bio" style="display:none"></div>

  <!-- ✅ PICS WAPAS - Upar wale gol icons -->
  <div id="topIconsBox" class="icons" style="display:none;">
    <a id="topYt" href="#" target="_blank" style="display:none;"><i class="fa-brands fa-youtube"></i></a>
    <a id="topInsta" href="#" target="_blank" style="display:none;"><i class="fa-brands fa-instagram"></i></a>
    <a id="topTikTok" href="#" target="_blank" style="display:none;"><i class="fa-brands fa-tiktok"></i></a>
    <a id="topWa" href="#" target="_blank" style="display:none;"><i class="fa-brands fa-whatsapp"></i></a>
    <a id="topMail" href="#" target="_blank" style="display:none;"><i class="fa-solid fa-envelope"></i></a>
  </div>

  <div id="linksList"></div>
  <h3 id="prodHeading" style="margin:25px 0 10px; display:none;">My Products 🛍️</h3>
  <div id="productsList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD3hKXZ87S5SgSfFqUNG7uKChuX-iVSwSo",
    authDomain: "linkspace-e77d2.firebaseapp.com",
    databaseURL: "https://linkspace-e77d2-default-rtdb.firebaseio.com",
    projectId: "linkspace-e77d2",
    storageBucket: "linkspace-e77d2.firebasestorage.app",
    messagingSenderId: "787498317437",
    appId: "1:787498317437:web:6b01e5c38738dc4a282314",
    measurementId: "G-JQWGWZQQMQ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const rtdb = firebase.database();

  let username = "";
  const params = new URLSearchParams(window.location.search);
  username = params.get("u") || params.get("username") || "";
  if (!username) {
    const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
    const parts = path.split("/").filter(Boolean);
    if (parts.length > 0 && parts[0] !== "index.html" && !parts[0].includes(".html")) username = parts[0];
  }
  if (!username) username = "rr44";
  username = username.trim().toLowerCase();

  let words = ["Surajpur | Creator", "YouTuber", "Instagram Star"];
  let wi = 0, li = 0;
  let el = document.getElementById("typing");
  function type2(){
    if(li <= words[wi].length){ el.innerHTML = words[wi].substring(0, li); li++; setTimeout(type2, 100); }
    else { setTimeout(()=>{ li=0; wi=(wi+1)%words.length; type2(); }, 1500); }
  }
  type2();

  function showTopIcon(id, url){
    document.getElementById("topIconsBox").style.display = "flex";
    const a = document.getElementById(id);
    a.style.display = "flex";
    a.href = url;
  }

  function showOneLink(l){
    if (!l) return;
    if (l.isActive === false || l.active === false || l.visible === false) return;
    let url = l.url || l.link || l.href || l.value || l.destination || "#";
    if (url !== "#" && !url.startsWith("http") && !url.startsWith("mailto:") && !url.startsWith("tel:")) url = "https://" + url;
    const title = l.title || l.name || l.label || "Link";
    let titleLower = title.toLowerCase();
    let subtitle = l.subtitle || l.desc || l.description || "";
    let iconClass = "fa-solid fa-link"; let bgClass = "prod-bg";
    if (titleLower.includes("insta")) { iconClass = "fa-brands fa-instagram"; bgClass = "insta-bg"; if(!subtitle) subtitle = "Follow karo"; showTopIcon("topInsta", url); }
    else if (titleLower.includes("youtube") || titleLower.includes("yt") || titleLower.includes("you")) { iconClass = "fa-brands fa-youtube"; bgClass = "yt-bg"; if(!subtitle) subtitle = "Subscribe karo"; showTopIcon("topYt", url); }
    else if (titleLower.includes("whats") || titleLower.includes("whatsapp") || titleLower.includes("wa") || url.includes("wa.me")) { iconClass = "fa-brands fa-whatsapp"; bgClass = "wa-bg"; if(!subtitle) subtitle = "Chat karo"; showTopIcon("topWa", url); }
    else if (titleLower.includes("tiktok") || titleLower.includes("tik")) { iconClass = "fa-brands fa-tiktok"; bgClass = "prod-bg"; if(!subtitle) subtitle = "Follow karo"; showTopIcon("topTikTok", url); }
    else if (titleLower.includes("mail") || titleLower.includes("email") || titleLower.includes("gmail")) { iconClass = "fa-solid fa-envelope"; bgClass = "prod-bg"; if(!subtitle) subtitle = "Mail karo"; showTopIcon("topMail", url); }
    else { if(!subtitle) subtitle = "Open karo"; }
    if (document.getElementById("linksList").innerHTML.includes(`href="${url}"`) && url !== "#") return;
    document.getElementById("linksList").innerHTML += `<a class="btn" href="${url}" target="_blank">
      <span class="icon-box ${bgClass}"><i class="${iconClass}"></i></span><div>${title} <small>${subtitle}</small></div><span class="arrow">↗</span></a>`;
  }

  // ✅ PRODUCT - Image ke saath
  function showOneProduct(p){
    if (!p || typeof p !== "object") return;
    if (p.isActive === false || p.active === false || p.visible === false) return;
    console.log("Product mila:", p);
    const title = p.title || p.name || p.productName || p.productTitle || p.itemName || p.label || "Product";
    const desc = p.desc || p.description || p.productDesc || p.productDescription || p.bio || p.details || "Buy Now";
    const price = p.price || p.productPrice || p.amount || p.cost || p.mrp || "";
    let url = p.url || p.link || p.href || p.buyLink || p.productLink || p.productUrl || p.linkUrl || p.buyUrl || p.checkoutLink || p.checkoutUrl || p.value || p.destination || "#";
    if (url !== "#" && !url.startsWith("http") && !url.startsWith("mailto:")) url = "https://" + url;
    let img = p.image || p.imageUrl || p.photo || p.photoUrl || p.img || p.thumbnail || p.cover || p.productImage || p.productPhoto || "";
    let iconHtml = "";
    if (img) {
      iconHtml = `<span class="icon-box prod-bg"><img src="${img}" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-bag-shopping\\'></i>'"></span>`;
    } else {
      iconHtml = `<span class="icon-box prod-bg"><i class="fa-solid fa-bag-shopping"></i></span>`;
    }
    document.getElementById("prodHeading").style.display = "block";
    if (document.getElementById("productsList").innerHTML.includes(`>${title} <small>`)) return;
    document.getElementById("productsList").innerHTML += `<a class="btn" href="${url}" target="_blank">
      ${iconHtml}
      <div>${title} <small>${desc} ${price ? ' - ₹'+price : ''}</small></div><span class="arrow">↗</span></a>`;
  }

  function loadAll(){
    db.collection("users").doc(username).get().then(doc => {
      if (!doc.exists) return;
      const data = doc.data();
      console.log("Profile Data:", data);
      if (data.name) document.getElementById("fullName").innerText = data.name;
      if (data.bio) { document.getElementById("bio").innerText = data.bio; words = [data.bio, "Surajpur | Creator", "YouTuber"]; }
      if (data.photoUrl || data.photo) document.getElementById("photo").src = data.photoUrl || data.photo;
      document.title = (data.name || username) + " | LinkSpace";
      if (data.email) showOneLink({title:"Email", url:"mailto:" + data.email, subtitle:"Mail karo"});
      if (Array.isArray(data.links)) data.links.forEach(showOneLink);
      if (Array.isArray(data.socialLinks)) data.socialLinks.forEach(showOneLink);
      if (Array.isArray(data.socials)) data.socials.forEach(showOneLink);
      if (Array.isArray(data.products)) data.products.forEach(showOneProduct);
      if (Array.isArray(data.shop)) data.shop.forEach(showOneProduct);
      if (Array.isArray(data.store)) data.store.forEach(showOneProduct);
      if (Array.isArray(data.items)) data.items.forEach(showOneProduct);
      if (Array.isArray(data.myProducts)) data.myProducts.forEach(showOneProduct);
      if (data.product && typeof data.product === "object") showOneProduct(data.product);
      if (data.products && !Array.isArray(data.products) && typeof data.products === "object") Object.values(data.products).forEach(showOneProduct);
    });

    ["links","products","shop","store","items"].forEach(col => {
      db.collection("users").doc(username).collection(col).get().then(snap => {
        console.log("Firestore", col, snap.size);
        snap.forEach(d => { if(col === "links") showOneLink(d.data()); else showOneProduct(d.data()); });
      }).catch(()=>{});
    });

    rtdb.ref("users/" + username).once("value").then(s => {
      const data = s.val(); console.log("RTDB Data:", data); if(!data) return;
      if (data.email) showOneLink({title:"Email", url:"mailto:" + data.email, subtitle:"Mail karo"});
      if (Array.isArray(data.links)) data.links.forEach(showOneLink);
      else if (data.links && typeof data.links === "object") Object.values(data.links).forEach(showOneLink);
      if (Array.isArray(data.products)) data.products.forEach(showOneProduct);
      else if (data.products && typeof data.products === "object") Object.values(data.products).forEach(showOneProduct);
      if (Array.isArray(data.shop)) data.shop.forEach(showOneProduct);
      else if (data.shop && typeof data.shop === "object") Object.values(data.shop).forEach(showOneProduct);
      if (data.product && typeof data.product === "object") showOneProduct(data.product);
    });
    ["links","products","shop","store"].forEach(col => {
      rtdb.ref("users/" + username + "/" + col).once("value").then(s => { const v = s.val(); if(!v) return; Object.values(v).forEach(item => { if(col === "links") showOneLink(item); else showOneProduct(item); }); });
    });
    db.collection("products").where("username", "==", username).get().then(snap => { snap.forEach(d => showOneProduct(d.data())); }).catch(()=>{});
    db.collection("products").where("userId", "==", username).get().then(snap => { snap.forEach(d => showOneProduct(d.data())); }).catch(()=>{});
  }
  loadAll();

  let canvas = document.getElementById("stars");
  let ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let stars = [];
  for(let i=0;i<80;i++){ stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.5, s:Math.random()*0.5+0.2}); }
  function drawStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    stars.forEach(st=>{ ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill(); st.y -= st.s; if(st.y<0) st.y=canvas.height; });
    requestAnimationFrame(drawStars);
  }
  drawStars();
</script>
</body>
</html>
