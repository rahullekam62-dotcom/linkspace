<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkSpace Profile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #f0f2f5; display: flex; justify-content: center; padding: 20px 12px; }
  .container { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #6C5CE7; margin: 0 auto; display: block; background:#eee; }
  .full-name { font-size: 26px; font-weight: 800; margin-top: 14px; color: #111; }
  .username { font-size: 14px; color: #6C5CE7; font-weight: 600; margin-top: 2px; }
  .bio { font-size: 14px; color: #666; margin-top: 6px; line-height: 1.5; padding: 0 10px; }
  .section-title { text-align: left; font-size: 14px; font-weight: 700; color: #888; margin: 24px 0 10px 4px; text-transform: uppercase; letter-spacing: 1px; }
  .link-btn { display: flex; align-items: center; gap: 12px; background: #f8f7ff; border: 1px solid #eee; padding: 14px 16px; border-radius: 14px; text-decoration: none; color: #111; font-weight: 600; margin-bottom: 10px; }
  .link-btn img { width: 28px; height: 28px; border-radius: 8px; }
  .link-btn span { flex: 1; text-align: left; }
  .product-card { display: flex; gap: 12px; background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 10px; margin-bottom: 10px; text-align: left; text-decoration: none; color: #111; }
  .product-card img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .product-card b { font-size: 15px; display: block; }
  .product-card p { font-size: 13px; color: #666; }
  .price { color: #6C5CE7; font-weight: 800; font-size: 14px; margin-top: 4px; }
  .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

<div class="container">
  <img id="photo" class="profile-img" src="https://via.placeholder.com/110" alt="Profile">
  <div id="fullName" class="full-name">Loading...</div>
  <div id="bio" class="bio"></div>

  <div class="section-title">Links</div>
  <div id="linksList"></div>

  <div class="section-title">Products</div>
  <div id="productsList"></div>

  <div class="footer">Made with LinkSpace ❤️</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD3hKXZ87S5SgSfFqUNG7uKChuX-iVSwSo",
    authDomain: "linkspace-e77d2.firebaseapp.com",
    databaseURL: "https://linkspace-e77d2-default-rtdb.firebaseio.com",
    projectId: "linkspace-e77d2",
    storageBucket: "linkspace-e77d2.firebasestorage.app",
    messagingSenderId: "787498317437",
    appId: "1:787498317437:web:6b01e5c38738dc4a282314",
    measurementId: "G-JQWGWZQQMQ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ✅ FIXED: USERNAME NIKALNA - /rr44 aur /?u=rr44 dono chalega
  let username = "";
  // Pehle ?u= check karo
  const params = new URLSearchParams(window.location.search);
  username = params.get("u") || params.get("username") || "";

  // Agar ?u me nahi hai to pathname se lo - /rr44
  if (!username) {
    const path = window.location.pathname.replace(/^\/+|\/+$/g, ""); // aage-piche ke / hatao
    const parts = path.split("/").filter(Boolean);
    // index.html ko username mat maano
    if (parts.length > 0 && parts[0] !== "index.html" && !parts[0].includes(".html")) {
      username = parts[0];
    }
  }

  // Agar abhi bhi khali hai (sirf linkspace.co.in khola hai) to rr44 dikhao
  if (!username) username = "rr44";
  username = username.trim().toLowerCase();

  console.log("Username mila:", username);
  document.getElementById("usernameDisplay").innerText = "@" + username;

  // --- Profile ---
  db.collection("users").doc(username).get().then(doc => {
    if (!doc.exists) {
      document.getElementById("fullName").innerText = "User Not Found";
      document.getElementById("bio").innerText = "@" + username + " naam se Firestore me koi data nahi hai";
      return;
    }
    const data = doc.data();
    console.log("Template Data:", data);
    if (data.name) document.getElementById("fullName").innerText = data.name;
    if (data.bio) document.getElementById("bio").innerText = data.bio;
    if (data.photoUrl) document.getElementById("photo").src = data.photoUrl;
    document.title = (data.name || username) + " | LinkSpace";
  }).catch(e => {
    console.log("Firestore Error:", e);
    document.getElementById("fullName").innerText = "Error: " + e.message;
  });

  // Links - users/rr44/links se
  db.collection("users").doc(username).collection("links").orderBy("createdAt", "asc").get().then(snap => {
    const box = document.getElementById("linksList");
    box.innerHTML = "";
    snap.forEach(d => {
      const l = d.data();
      if (l.isActive === false) return;
      box.innerHTML += `<a class="link-btn" href="${l.url}" target="_blank">
        <img src="${l.icon || 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png'}">
        <span>${l.title || 'Link'}</span><span>→</span></a>`;
    });
    if (snap.empty) box.innerHTML = "<p style='color:#aaa;font-size:13px'>No links yet</p>";
  }).catch(e => {
    document.getElementById("linksList").innerHTML = "<p style='color:#aaa;font-size:13px'>Links load nahi hue</p>";
  });

  // Products - users/rr44/products se
  db.collection("users").doc(username).collection("products").get().then(snap => {
    const box = document.getElementById("productsList");
    box.innerHTML = "";
    snap.forEach(d => {
      const p = d.data();
      box.innerHTML += `<a class="product-card" href="${p.url || '#'}" target="_blank">
        <img src="${p.image || p.photoUrl || 'https://via.placeholder.com/64'}">
        <div><b>${p.title || p.name || 'Product'}</b><p>${p.desc || p.bio || ''}</p>
        <div class="price">₹${p.price || ''}</div></div></a>`;
    });
    if (snap.empty) box.innerHTML = "<p style='color:#aaa;font-size:13px'>No products yet</p>";
  });
</script>
</body>
</html>
